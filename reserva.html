<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Afrodita Nails - Reservas</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="CSS/styles.css">
    <link rel="stylesheet" href="CSS/reserva.css">
    <link rel="stylesheet" href="CSS/accesibilidad.css">
</head>

<body>
    <!-- Encabezado -->
    <header>
        <!-- Logo y nombre -->
        <div class="header-top">
            <img src="IMG/ImgLogo.jpg" alt="Logo Afrodita Nails" class="logo-header">
            <h1>Afrodita Nails</h1>
        </div>
        <!-- Menú de navegación -->
        <nav aria-label="Navegación principal">
            <button class="menu-hamburguesa" id="btn-menu" aria-label="Abrir menú de navegación" aria-expanded="false">☰</button>
            <div class="nav-links" id="nav-links">
                <a href="index.html">Inicio</a>
                <a href="servicios.html">Servicios</a>
                <a href="contacto.html">Contacto</a>
                <a href="ubicacion.html">Ubicación</a>
                <a href="nosotros.html">Nosotros</a>
            </div>
        </nav>
    </header>

    <main id="contenido-principal">
        <h2>Reservar Cita</h2>

        <!-- Formulario de reserva -->
        <form id="form-reserva" aria-label="Formulario de reserva de cita" novalidate>
            <label for="nombre-reserva">Nombre:</label>
            <input type="text" id="nombre-reserva" autocomplete="name" aria-required="true" required>
            <label for="telefono-reserva">Número de teléfono:</label>
            <input type="tel" id="telefono-reserva" placeholder="Ej: 3001234567" autocomplete="tel" aria-required="true" required>
            <label for="servicio-reserva">Servicio:</label>
            <select id="servicio-reserva" aria-required="true" required>
                <option value="">Seleccione un servicio</option>
                <option>Manicure Tradicional</option>
                <option>Manicure Semipermanente</option>
                <option>Uñas Acrílicas</option>
                <option>Uñas SoftGel</option>
                <option>Uñas PolyGel</option>
            </select>
            <label for="fecha">Fecha:</label>
            <input type="date" id="fecha" aria-required="true" required>
            <label for="hora">Horas disponibles:</label>
            <select id="hora" aria-required="true" required>
                <option value="">Seleccione una hora</option>
            </select>

            <label for="sede-reserva">Sede:</label>
            <select id="sede-reserva" aria-required="true" required>
                <option value="">Seleccione una sede</option>
                <option>Sede Chapinero — Calle 72 #10-34</option>
                <option>Sede Usaquén — Carrera 15 #93-47</option>
                <option>Sede Teusaquillo — Calle 45 #13-22</option>
                <option>Sede Santa Fe — Carrera 7 #32-16</option>
            </select>

            <button type="submit">Reservar</button>
        </form>

        <!-- Confirmación en sede -->
        <div id="confirmacion-sede" class="confirmacion-reserva" style="display:none;" role="alert" aria-live="polite">
            <div class="estrellas" aria-hidden="true">⭐✨⭐✨⭐</div>
            <h3>¡Tu cita fue reservada!</h3>
            <p id="detalle-reserva"></p>
            <a href="index.html" class="btn-volver">Volver al inicio</a>
        </div>

    </main>

    <!-- Widget de accesibilidad -->
    <div class="accesibilidad-widget">
        <div class="panel-accesibilidad" id="panel-accesibilidad" hidden>
            <p class="panel-titulo">Accesibilidad</p>
            <button class="opcion-acc" id="btn-contraste" aria-pressed="false">🔆 Alto contraste</button>
            <button class="opcion-acc" id="btn-fuente"    aria-pressed="false">🔤 Texto más grande</button>
            <button class="opcion-acc" id="btn-enlaces"   aria-pressed="false">🔗 Subrayar enlaces</button>
        </div>
        <button class="btn-accesibilidad" id="btn-accesibilidad" aria-label="Opciones de accesibilidad" aria-expanded="false">♿</button>
    </div>

    <!-- Pie de página -->
    <footer>
        <p>&copy; 2026 Afrodita Nails. Todos los derechos reservados.</p>
    </footer>

    <script src="JS/reserva.js"></script>
    <script src="JS/accesibilidad.js"></script>
    <script src="JS/nav.js"></script>

</body>
</html>
